server {
    listen 8080;
    root ./YoupiBanane;
    index youpi.bad_extension;
    client_max_body_size 200m;

    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allowed_methods GET POST;
        cgi_ext .bla ./cgi_tester;
    }

    location /post_body {
        root ./YoupiBanane;
        allowed_methods POST;
        upload_store ./YoupiBanane;
        client_max_body_size 100;
    }

    location / {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allowed_methods GET;
    }
}
