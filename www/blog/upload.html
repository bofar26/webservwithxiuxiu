<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Upload</title>
</head>
<body>
    <h1>Upload a file</h1>

    <!-- enctype="multipart/form-data" is what makes the browser wrap the file
         in the envelope that Router::extractMultipart unwraps -->
    <form action="/uploads/" method="POST" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Send</button>
    </form>

    <p><a href="/uploads/">See what has been uploaded</a></p>
</body>
</html>
